<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRITHDAY HENDY LUKMAN </title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --neon-gold: #ffd700; /* Warna Crown elegan */
            --neon-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #cccccc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- BACKGROUND UTAMA --- */
        /* Layer 1: Gambar Background Kamu (Di Folder) */
        .bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* GANTI 'bg-hendy.jpg' dengan nama file background kamu */
            background-image: url('rh2.jpeg'); 
            background-size: cover;
            background-position: center;
            opacity: 0; /* Hidden di awal */
            transition: filter 2s ease, opacity 2s ease;
            z-index: 1;
        }

        /* Layer 2: Grain Effect (Tekstur film) */
        .bg-grain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 2;
        }

        /* Layer 3: Vignette (Gelap di pinggir) */
        .bg-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* Layer 4: Cahaya Neon Bergerak */
        .neon-light {
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            animation: moveLight 8s infinite alternate ease-in-out;
            z-index: 1;
            opacity: 0; /* Muncul pelan-pelan */
            transition: opacity 3s;
        }
        @keyframes moveLight {
            0% { transform: translate(-30%, -30%); }
            100% { transform: translate(30%, 30%); }
        }

        /* --- SECTIONS --- */
        section {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }
        section.active { opacity: 1; pointer-events: all; }

        /* --- 1. OPENING TEXT --- */
        #opening-screen {
            z-index: 20; /* Di atas background */
        }
        .opening-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 2s, transform 2s;
        }
        .opening-sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: var(--neon-pink);
            margin-top: 15px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 2s 0.5s, transform 2s 0.5s; /* Delay */
        }

        /* --- 2. TRANSISI KE COVER (BIG 21) --- */
        #transition-screen {
            z-index: 30;
        }
        .date-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 5px;
            opacity: 0;
            animation: fadeInOut 3s forwards;
        }
        .big-number {
            font-family: 'Cinzel', serif;
            font-size: 15vw; /* Sangat besar */
            line-height: 1;
            color: var(--neon-pink);
            text-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
            opacity: 0;
            transform: scale(1.5); /* Mulai besar */
            transition: all 2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeInOut {
            0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; }
        }

        /* --- 3. COVER SCREEN --- */
        #cover-screen { z-index: 40; }
        
        .crown-icon {
            width: 60px; height: 60px;
            fill: var(--neon-gold);
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(-20px);
        }

        .cover-21 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 3px;
            margin-bottom: 5px;
            opacity: 0;
            transform: scale(0.9);
        }

        .cover-name {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(20px);
        }

        .cover-tribute {
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
            color: #ddd;
            opacity: 0;
            margin-bottom: 40px;
        }

        .logo-rh {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: 5px;
            opacity: 0;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 15px;
            margin-top: 20px;
        }

        /* Animasi Bertahap (Staggered) */
        #cover-screen.active .crown-icon { animation: fadeInUp 1s forwards 0.5s; }
        #cover-screen.active .cover-21 { animation: fadeInScale 1s forwards 1s; }
        #cover-screen.active .cover-name { animation: fadeInUp 1s forwards 1.5s; }
        #cover-screen.active .cover-tribute { animation: fadeIn 1s forwards 2s; }
        #cover-screen.active .logo-rh { animation: fadeIn 1s forwards 2.5s; }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { to { opacity: 1; } }

        /* --- 5. TOMBOL AYO LANJUTT --- */
        .btn-continue {
            margin-top: 50px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            padding: 15px 40px;
            font-size: 1rem;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            opacity: 0; /* Muncul terakhir */
            animation: fadeIn 1s forwards 3s;
        }

        /* Efek Glow Breath */
        .btn-continue {
            animation: fadeIn 1s forwards 3s, breathGlow 3s infinite ease-in-out 4s;
        }

        @keyframes breathGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.6); border-color: #fff; text-shadow: 0 0 5px #fff; }
        }

        /* Efek Klik Tombol */
        .btn-continue:active {
            transform: scale(0.95);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .big-number { font-size: 20vw; }
            .cover-21 { font-size: 2rem; }
            .cover-name { font-size: 2.2rem; }
            .opening-text { font-size: 1.2rem; }
        }

    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <!-- 1. Gambar Kamu (Ganti bg-hendy.jpg) -->
    <div class="bg-image" id="mainBg"></div>
    
    <!-- 2. Efek Tekstur -->
    <div class="bg-grain"></div>
    
    <!-- 3. Gelap Pinggir -->
    <div class="bg-vignette"></div>
    
    <!-- 4. Cahaya Neon -->
    <div class="neon-light" id="neonLight"></div>

    <!-- AUDIO (Ganti lagu.mpeg) -->
    <audio id="bg-music" loop>
        <source src="lagu.mpeg" type="audio/mpeg">
    </audio>

    <!-- === SECTION 1: OPENING TEXT === -->
    <section id="opening-screen" class="active">
        <h1 class="opening-text" id="text-1">RENCANG HENDY PRESENTS</h1>
        <h1 class="opening-text" id="text-2" style="font-size: 2rem; margin-top: 10px;">A SPECIAL DAY</h1>
        <p class="opening-sub" id="text-3">FOR SOMEONE SPECIAL</p>
    </section>

    <!-- === SECTION 2: TRANSISI (DATE & BIG 21) === -->
    <section id="transition-screen">
        <div class="date-text">16.09.2026</div>
        <div class="big-number" id="bigNum">21</div>
    </section>

    <!-- === SECTION 3: COVER UTAMA === -->
    <section id="cover-screen">
        <!-- Crown -->
        <svg class="crown-icon" viewBox="0 0 24 24">
            <path d="M5 16L3 5L8.5 10L12 4L15.5 10L21 5L19 16H5M19 19C19 19.6 18.6 20 18 20H6C5.4 20 5 19.6 5 19V18H19V19Z" />
        </svg>

        <!-- Teks Cover -->
        <div class="cover-21">21 TAHUN</div>
        <h1 class="cover-name">HENDY LUKMAN</h1>
        <p class="cover-tribute">A LITTLE CELEBRATION FROM RENCANG HENDY</p>

        <!-- Logo RH -->
        <div class="logo-rh">RH</div>

        <!-- Tombol -->
        <button class="btn-continue" onclick="startMainExperience()">AYO LANJUTT →</button>
    </section>

    <!-- SECTION TAMBAHAN (Untuk Halaman Selanjutnya) -->
    <section id="next-content-screen" style="background: #000;">
        <h1 style="color: white;">WELCOME TO THE MAIN EVENT</h1>
        <p style="color: #888;">(Ini adalah tempat konten selanjutnya)</p>
    </section>

    <script>
        /* --- REFERENSI ELEMEN --- */
        const openingScreen = document.getElementById('opening-screen');
        const transitionScreen = document.getElementById('transition-screen');
        const coverScreen = document.getElementById('cover-screen');
        const nextContentScreen = document.getElementById('next-content-screen');
        
        const mainBg = document.getElementById('mainBg');
        const neonLight = document.getElementById('neonLight');
        const bigNum = document.getElementById('bigNum');

        /* --- 1. OPENING SEQUENCE (MULAI OTOMATIS) --- */
        window.onload = function() {
            // A. Munculkan teks satu per satu
            setTimeout(() => document.getElementById('text-1').style.opacity = 1, 500);
            setTimeout(() => document.getElementById('text-2').style.opacity = 1, 2000);
            setTimeout(() => document.getElementById('text-3').style.opacity = 1, 3500);

            // B. Background muncul perlahan (Blur -> Clear) & Neon
            setTimeout(() => {
                mainBg.style.opacity = 1;
                mainBg.style.filter = "blur(10px)"; // Masih blur saat opening
                neonLight.style.opacity = 1;
            }, 1000);

            // C. Teks menghilang -> Pindah ke Transisi
            setTimeout(() => {
                openingTextFadeOut();
            }, 6000); // Tunggu 6 detik total di opening
        };

        function openingTextFadeOut() {
            const texts = [document.getElementById('text-1'), document.getElementById('text-2'), document.getElementById('text-3')];
            texts.forEach(t => t.style.opacity = 0);

            setTimeout(() => {
                openingScreen.classList.remove('active');
                startTransition();
            }, 1500);
        }

        /* --- 2. TRANSISI KE COVER (BIG 21) --- */
        function startTransition() {
            transitionScreen.classList.add('active');
            
            // Munculkan Tanggal
            setTimeout(() => {
                document.querySelector('.date-text').style.opacity = 1;
            }, 500);

            // Munculkan Angka 21 Besar
            setTimeout(() => {
                bigNum.style.opacity = 1;
                bigNum.style.transform = "scale(1)"; // Zoom out effect
            }, 2500);

            // Efek "Mengecil jadi Cover"
            // Kita scale up layar (zoom in) seolah-olah masuk ke angka 21
            setTimeout(() => {
                document.body.style.transition = "transform 1.5s ease-in";
                document.body.style.transform = "scale(1.5)"; // Layar Zoom In
                
                // Saat bersamaan, background blur berkurang (jadi jelas)
                mainBg.style.filter = "blur(0px)";
                
                setTimeout(() => {
                    transitionScreen.classList.remove('active');
                    coverScreen.classList.add('active');
                    // Reset zoom body agar cover pas di layar
                    setTimeout(() => {
                        document.body.style.transition = "none";
                        document.body.style.transform = "scale(1)";
                    }, 100);
                }, 1200);
            }, 4500);
        }

        /* --- 3. TOMBOL DI TEKAN (MUSIK & LANJUT) --- */
        function startMainExperience() {
            const audio = document.getElementById('bg-music');
            
            // Play Musik
            audio.play().catch(e => console.log("Browser memblokir autoplay, perlu interaksi user"));

            // Efek Visual saat klik
            coverScreen.style.transition = "transform 0.8s ease, opacity 0.8s ease";
            coverScreen.style.transform = "scale(1.1)"; // Zoom in sedikit
            coverScreen.style.opacity = "0";

            // Fade to Black (Background ikut gelap)
            mainBg.style.transition = "opacity 0.8s";
            mainBg.style.opacity = "0";

            // Pindah ke halaman selanjutnya (Next Content)
            setTimeout(() => {
                coverScreen.classList.remove('active');
                nextContentScreen.classList.add('active');
                // Jika kamu mau halaman hitam kosong dulu, comment baris di atas
            }, 800);
        }
    </script>
</body>
</html>
